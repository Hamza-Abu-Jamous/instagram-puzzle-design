<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Instagram Profile 6-Post Light Mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f172a;
    padding: 40px;
    font-family: 'Cairo', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .phone-frame {
    width: 480px;
    background: #ffffff;
    border-radius: 46px;
    border: 4px solid #334155;
    box-shadow: 0 30px 90px rgba(0,0,0,0.6);
    overflow: hidden;
    padding: 16px 0 24px;
    display: flex;
    flex-direction: column;
  }
  .phone-top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 24px 14px;
    font-size: 14px;
    font-weight: 800;
    color: #0f172a;
    font-family: 'Plus Jakarta Sans', sans-serif;
    direction: ltr;
  }
  .profile-header {
    display: flex;
    align-items: center;
    padding: 10px 24px 16px;
    gap: 18px;
    direction: ltr;
  }
  .avatar {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: linear-gradient(135deg, #10b981, #06b6d4);
    padding: 3px;
  }
  .avatar-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 20px;
    color: #059669;
  }
  .stats {
    flex: 1;
    display: flex;
    justify-content: space-around;
    text-align: center;
  }
  .stat-val { font-weight: 800; font-size: 16px; color: #0f172a; }
  .stat-lbl { font-size: 11px; color: #64748b; }
  .bio {
    padding: 0 24px 16px;
    font-size: 13.5px;
    line-height: 1.5;
    color: #334155;
  }
  .bio b { color: #0f172a; }
  .bio span { color: #059669; font-weight: 700; }
  
  .tabs {
    display: flex;
    border-top: 1px solid #e2e8f0;
    border-bottom: 1px solid #e2e8f0;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 10px 0;
    font-size: 18px;
    color: #94a3b8;
  }
  .tab.active {
    color: #0f172a;
    border-bottom: 2px solid #0f172a;
  }
  
  .grid-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
    background: #ffffff;
    direction: ltr;
    margin-top: 2px;
  }
  .grid-cell {
    aspect-ratio: 4 / 5;
    background: #f1f5f9;
    overflow: hidden;
  }
  .grid-cell img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
</style>
</head>
<body>
  <div class="phone-frame">
    <div class="phone-top-bar">
      <span>9:41</span>
      <span>programmersit</span>
      <span>•••</span>
    </div>
    <div class="profile-header">
      <div class="avatar"><div class="avatar-inner">PIT</div></div>
      <div class="stats">
        <div><div class="stat-val">6</div><div class="stat-lbl">Posts</div></div>
        <div><div class="stat-val">14.2K</div><div class="stat-lbl">Followers</div></div>
        <div><div class="stat-val">192</div><div class="stat-lbl">Following</div></div>
      </div>
    </div>
    <div class="bio">
      <b>Programmers IT</b> | Next-Gen Enterprise Solutions<br>
      الذكاء الاصطناعي، الأنظمة المخصصة، والتحول الرقمي المؤسسي 🇦🇪<br>
      <span>📍 Dubai, United Arab Emirates</span>
    </div>
    <div class="tabs">
      <div class="tab active">▦</div>
      <div class="tab">▶</div>
      <div class="tab">👤</div>
    </div>
    <!-- 6-Post Grid in Instagram Layout -->
    <div class="grid-container">
      <!-- Row 1: Top -->
      <div class="grid-cell"><img src="06_POST_6_Publish_6th_Top_Left.png"></div>
      <div class="grid-cell"><img src="05_POST_5_Publish_5th_Top_Center.png"></div>
      <div class="grid-cell"><img src="04_POST_4_Publish_4th_Top_Right.png"></div>
      <!-- Row 2: Bottom -->
      <div class="grid-cell"><img src="03_POST_3_Publish_3rd_Bottom_Left.png"></div>
      <div class="grid-cell"><img src="02_POST_2_Publish_2nd_Bottom_Center.png"></div>
      <div class="grid-cell"><img src="01_POST_1_Publish_1st_Bottom_Right.png"></div>
    </div>
  </div>
</body>
</html>
