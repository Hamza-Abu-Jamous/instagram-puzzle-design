<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Instagram 3-Post Modern Puzzle Mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #090d16;
    padding: 40px;
    font-family: 'Cairo', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .phone-frame {
    width: 480px;
    background: #000000;
    border-radius: 46px;
    border: 3.5px solid #334155;
    box-shadow: 0 30px 90px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.08);
    overflow: hidden;
    padding: 16px 0 24px;
    display: flex;
    flex-direction: column;
    color: #ffffff;
  }
  .phone-top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 24px 14px;
    font-size: 13.5px;
    font-weight: 800;
    color: #ffffff;
    font-family: 'Plus Jakarta Sans', sans-serif;
    direction: ltr;
  }
  .profile-header {
    display: flex;
    align-items: center;
    padding: 10px 24px 16px;
    gap: 18px;
    direction: ltr;
  }
  .avatar {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: linear-gradient(135deg, #10b981, #06b6d4);
    padding: 3px;
  }
  .avatar-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: #090d16;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 20px;
    color: #34d399;
  }
  .stats {
    flex: 1;
    display: flex;
    justify-content: space-around;
    text-align: center;
  }
  .stat-val { font-weight: 800; font-size: 16px; color: #ffffff; }
  .stat-lbl { font-size: 11px; color: #94a3b8; }
  .bio {
    padding: 0 24px 16px;
    font-size: 13.5px;
    line-height: 1.5;
    color: #cbd5e1;
  }
  .bio b { color: #ffffff; }
  .bio span { color: #34d399; font-weight: 700; }
  
  .tabs {
    display: flex;
    border-top: 1px solid #1e293b;
    border-bottom: 1px solid #1e293b;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 10px 0;
    font-size: 18px;
    color: #64748b;
  }
  .tab.active {
    color: #ffffff;
    border-bottom: 2px solid #ffffff;
  }
  
  .grid-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
    background: #000000;
    direction: ltr;
    margin-top: 2px;
  }
  .grid-cell {
    aspect-ratio: 4 / 5;
    background: #0f172a;
    overflow: hidden;
  }
  .grid-cell img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
</style>
</head>
<body>
  <div class="phone-frame">
    <div class="phone-top-bar">
      <span>9:41</span>
      <span>programmersit</span>
      <span>•••</span>
    </div>
    <div class="profile-header">
      <div class="avatar"><div class="avatar-inner">PIT</div></div>
      <div class="stats">
        <div><div class="stat-val">3</div><div class="stat-lbl">Posts</div></div>
        <div><div class="stat-val">14.2K</div><div class="stat-lbl">Followers</div></div>
        <div><div class="stat-val">192</div><div class="stat-lbl">Following</div></div>
      </div>
    </div>
    <div class="bio">
      <b>Programmers IT</b> | Enterprise AI & Software Engineering<br>
      نطور حلول الذكاء الاصطناعي، الأنظمة المخصصة والمنصات الذكية 🇦🇪<br>
      <span>📍 Dubai, United Arab Emirates</span>
    </div>
    <div class="tabs">
      <div class="tab active">▦</div>
      <div class="tab">▶</div>
      <div class="tab">👤</div>
    </div>
    <!-- 3-Post Grid in Instagram Layout -->
    <div class="grid-container">
      <div class="grid-cell"><img src="03_POST_3_Publish_3rd_Left_1080x1350.png"></div>
      <div class="grid-cell"><img src="02_POST_2_Publish_2nd_Center_1080x1350.png"></div>
      <div class="grid-cell"><img src="01_POST_1_Publish_1st_Right_1080x1350.png"></div>
    </div>
  </div>
</body>
</html>
